<!doctype html>
<html lang="en" data-page-ready="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Relay"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><title>Relay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/shared.css"><script src="/i18n.js" defer></script><script src="/app.js" defer></script></head>
<body><main id="screen" data-state="checking" data-route="unknown">
<header class="app-header"><div class="brand"><img src="/favicon.svg" alt="" width="40" height="40"><span>Relay</span></div><nav class="header-right" aria-label="App pages"><a href="/settings" data-i18n="Settings">Settings</a><a href="/guide" data-i18n="Guide">Guide</a><a href="/about" data-i18n="About">About</a></nav></header>
<div class="ambient-glow" aria-hidden="true"><i class="glow-direct"></i><i class="glow-vpn"></i><i class="glow-transition"></i><i class="glow-ripple"></i></div><section class="scene" aria-label="Connection control">
<div class="summary" aria-live="polite"><div data-i18n="YOUR CLIENT CONNECTION" id="eyebrow" class="eyebrow">YOUR CLIENT CONNECTION</div><h1 data-i18n="Checking connection" id="status-title">Checking connection</h1><p data-i18n="Connecting to your Mac…" id="description">Connecting to your Mac…</p></div>
<div class="power-zone"><div id="orbit" class="orbit"><button id="power" class="power" type="button" disabled aria-pressed="false" aria-label="Checking connection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 5.6a9 9 0 1 1-12.8 0"/></svg><span data-i18n="Please wait" id="button-label">Please wait</span></button></div></div>
<p data-i18n="One connection. Your choice." id="action-hint" class="action-hint">One connection. Your choice.</p>
<div id="mac-option" class="mac-option"><label><input id="keep-mac" type="checkbox" disabled><span data-i18n="Keep Mac VPN unchanged">Keep Mac VPN unchanged</span><span id="pref-progress" class="pref-progress" hidden role="status"><i class="spinner"></i><span id="pref-label"></span></span></label><p data-i18n="Mac VPN: checking" id="mac-state">Mac VPN: checking</p></div>
<p id="message" class="message" role="status"></p>
</section>
<footer><div class="route-caption"><i></i><span data-i18n="CHECKING SHARING ROUTE" id="route-title">CHECKING SHARING ROUTE</span></div><div id="route" class="route" role="group" aria-label="Checking sharing route"><span class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="15" width="18" height="6" rx="2"/><path d="M7 15V9m10 6V9M8 5a7 7 0 0 1 8 0M10 8a3 3 0 0 1 4 0M7 18h.01M11 18h.01"/></svg><span data-i18n="Modem">Modem</span></span><span class="wire" aria-hidden="true"></span><span class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v11H5zM2 19h20l-3-4H5z"/></svg><span data-i18n="Mac">Mac</span></span><span class="wire vpn-wire" aria-hidden="true"></span><span class="node vpn-hop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 5-5 8-8 9-3-1-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span id="vpn-hop-name">VPN</span></span><span class="wire" aria-hidden="true"></span><span class="node router-hop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="12" width="18" height="9" rx="2"/><path d="M7 12V4m10 8V4M7 16h.01M11 16h.01M15 16h2"/></svg><span data-i18n="Router">Router</span></span><span class="wire router-wire" aria-hidden="true"></span><span class="node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span data-i18n="Client">Client</span></span></div><div class="footer-notes"><span id="tv-address"></span><span data-i18n="Keep your Mac awake">Keep your Mac awake</span></div></footer>
</main></body></html>
